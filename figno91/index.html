    <!-- 导航栏 -->
    <header class="bg-white shadow-sm sticky top-0 z-50">

                <h1 class="text-xl md:text-2xl font-bold text-primary">∫igno 91</h1>

            <div class="flex items-center space-x-3">
                <div id="guestActions" class="flex items-center space-x-3">
                    <button id="loginBtn" class="btn-outline flex items-center space-x-1">
                        <i class="fa fa-sign-in"></i>
                        <span>登录</span>
                    </button>
                    <button id="registerBtn" class="btn-primary flex items-center space-x-1">
                        <i class="fa fa-user-plus"></i>
                        <span>注册</span>
                    </button>
                </div>
                <div id="userActions" class="flex items-center space-x-3 hidden">
                    <button id="nameSettingsBtn" class="btn-outline flex items-center space-x-1">

            </div>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="container mx-auto px-4 py-8">
        <!-- 发布Issue区域 -->
        <section id="publishSection" class="issue-card mb-8 hidden">
            <h2 class="text-xl font-bold mb-4 flex items-center">
                <i class="fa fa-pencil-square-o text-primary mr-2"></i>
                发布新文章
            </h2>
            <form id="issueForm" class="space-y-4">
                <div>
                    <label for="issueTitle" class="block text-sm font-medium text-gray-700 mb-1">标题</label>
                    <input type="text" id="issueTitle" class="input-field" placeholder="输入文章标题..." required>
                </div>
                <div>
                    <label for="issueContent" class="block text-sm font-medium text-gray-700 mb-1">内容</label>

                </div>
                <div class="flex justify-end">
                    <button type="submit" class="btn-primary flex items-center space-x-1">
                        <i class="fa fa-paper-plane"></i>
                        <span>发布</span>
                    </button>
                </div>

    <div id="registerModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">

    <!-- 名称设置模态框 -->
    <div id="nameModal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-md p-6 space-y-4">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-lg font-bold">设置你的名称</h3>
                <button class="closeModal text-gray-500 hover:text-gray-700">
                    <i class="fa fa-times"></i>
                </button>
            </div>
            <form id="nameForm" class="space-y-4">
                <div>
                    <label for="userName" class="block text-sm font-medium text-gray-700">显示名称</label>
                    <input type="text" id="userName" class="input-field" placeholder="输入你想显示的名称" required disabled>
                    <p class="text-sm text-red-500 mt-1 hidden">距离上次修改不足3个月，暂时无法修改</p>
                </div>
                <div class="text-sm text-gray-500">
                    <p>提示：每个用户每3个月可修改一次名称</p>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" class="cancelBtn btn-outline">取消</button>
                    <button type="submit" class="btn-primary">保存</button>
                </div>

    <script>
        // 存储数据的键名
        const STORAGE_KEY = {
            USERS: 'figno91_users',
            CURRENT_USER: 'figno91_current_user',
            USER_NAME: 'figno91_user_name_', // 后面加上用户名
            NAME_UPDATE_TIME: 'figno91_name_update_time_', // 后面加上用户名
            ISSUES: 'figno91_issues'
        };

        // 初始化页面
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化默认Issue（如果本地存储为空）
            initDefaultIssues();
            // 初始化用户数据（如果本地存储为空）
            initDefaultUsers();
            // 检查登录状态
            checkLoginStatus();
            // 加载Issue列表
            loadIssues();
            // 绑定事件
            bindEvents();
        });

        // 初始化默认用户数据
        function initDefaultUsers() {
            if (!localStorage.getItem(STORAGE_KEY.USERS)) {
                // 默认用户（仅用于测试）
                const defaultUsers = [
                    { username: 'testuser', password: 'test123', displayName: '测试用户' }
                ];
                localStorage.setItem(STORAGE_KEY.USERS, JSON.stringify(defaultUsers));
            }
        }

        // 初始化默认Issue
        function initDefaultIssues() {
            const existingIssues = JSON.parse(localStorage.getItem(STORAGE_KEY.ISSUES)) || [];
            if (existingIssues.length === 0) {
                // 默认示例Issue 1
                const exampleIssue1 = {
                    id: '1764249813294',
                    title: 'Test',
                    content: '这是一个示例 issue。',
                    author: 'Liu Jinxuan/刘锦轩',
                    authorUsername: 'testuser',
                    date: '2025/11/27 21:23',
                    timestamp: 1764249813294,
                    replies: [{
                        id: '1764249814000',
                        author: 'Liu Jinxuan/刘锦轩',
                        authorUsername: 'testuser',
                        content: 'test?',
                        date: '2025/11/27 21:23',
                        timestamp: 1764249814000
                    }]
                };

                // 默认示例Issue 2
                const exampleIssue2 = {
                    id: '1764163200000',
                    title: '这是一个示例Issue',
                    content: '这是示例Issue的内容，登录用户可以在这里分享想法、提出问题或交流讨论。登录后即可参与，快来发表你的观点吧！',
                    author: '示例用户',
                    authorUsername: 'testuser',
                    date: '2025-11-26 10:00',
                    timestamp: 1764163200000,
                    replies: [{
                        id: '1764165000000',
                        author: '用户A',
                        authorUsername: 'userA',
                        content: '这个示例很有帮助，我也想分享我的想法！',
                        date: '2025-11-26 10:30',
                        timestamp: 1764165000000
                    }, {
                        id: '1764167700000',
                        author: '用户B',
                        authorUsername: 'userB',
                        content: '支持这个平台，非常方便！',
                        date: '2025-11-26 11:15',
                        timestamp: 1764167700000
                    }]
                };

                localStorage.setItem(STORAGE_KEY.ISSUES, JSON.stringify([exampleIssue1, exampleIssue2]));
            }
        }

        // 检查登录状态
        function checkLoginStatus() {
            const currentUser = getCurrentUser();
            if (currentUser) {
                // 已登录状态
                document.getElementById('guestActions').classList.add('hidden');
                document.getElementById('userActions').classList.remove('hidden');
                document.getElementById('publishSection').classList.remove('hidden');
                document.getElementById('loginPrompt').classList.add('hidden');
                
                // 加载用户显示名称
                const displayName = getUserDisplayName(currentUser.username);
                document.getElementById('displayName').textContent = displayName || currentUser.username;
            } else {
                // 未登录状态
                document.getElementById('guestActions').classList.remove('hidden');
                document.getElementById('userActions').classList.add('hidden');
                document.getElementById('publishSection').classList.add('hidden');
                document.getElementById('loginPrompt').classList.remove('hidden');
            }
        }

        // 获取当前登录用户
        function getCurrentUser() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY.CURRENT_USER));
        }

        // 获取用户显示名称
        function getUserDisplayName(username) {
            return localStorage.getItem(STORAGE_KEY.USER_NAME + username);
        }

        // 加载Issue列表
        function loadIssues() {
            const issues = JSON.parse(localStorage.getItem(STORAGE_KEY.ISSUES)) || [];
            const issuesContainer = document.getElementById('issuesContainer');
            
            // 清空现有内容
            issuesContainer.innerHTML = '';
            
            // 按时间倒序渲染Issue
            issues.sort((a, b) => b.timestamp - a.timestamp).forEach(issue => {
                const issueElement = createIssueElement(issue);
                issuesContainer.appendChild(issueElement);
            });
        }

        // 绑定所有事件
        function bindEvents() {
            // 模态框通用关闭事件
            document.querySelectorAll('.closeModal, .cancelBtn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.fixed.inset-0').forEach(modal => {
                        modal.classList.add('hidden');
                    });
                });
            });

            // 点击模态框外部关闭
            document.querySelectorAll('.fixed.inset-0').forEach(modal => {
                modal.addEventListener('click', function(e) {
                    if (e.target === modal) {
                        modal.classList.add('hidden');
                    }
                });
            });

            // 登录/注册切换
            document.getElementById('switchToRegister').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('loginModal').classList.add('hidden');
                document.getElementById('registerModal').classList.remove('hidden');
            });

            document.getElementById('switchToLogin').addEventListener('click', function(e) {
                e.preventDefault();
                document.getElementById('registerModal').classList.add('hidden');
                document.getElementById('loginModal').classList.remove('hidden');
            });

            // 登录相关
            document.getElementById('loginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.remove('hidden');
            });

            document.getElementById('promptLoginBtn').addEventListener('click', function() {
                document.getElementById('loginModal').classList.remove('hidden');
            });

            document.getElementById('loginForm').addEventListener('submit', handleLogin);

            // 注册相关
            document.getElementById('registerBtn').addEventListener('click', function() {
                document.getElementById('registerModal').classList.remove('hidden');
            });

            document.getElementById('registerForm').addEventListener('submit', handleRegister);
            
            // 检查用户名是否存在
            document.getElementById('regUsername').addEventListener('blur', checkUsernameExists);
            
            // 检查密码是否一致
            document.getElementById('regConfirmPassword').addEventListener('blur', checkPasswordMatch);

            // 退出登录
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);

            // 名称设置相关
            document.getElementById('nameSettingsBtn').addEventListener('click', openNameModal);
            document.getElementById('nameForm').addEventListener('submit', handleNameSubmit);

            // 发布Issue
            document.getElementById('issueForm').addEventListener('submit', handleIssueSubmit);

            // 回复切换显示
            document.addEventListener('click', function(e) {
                if (e.target.closest('.replyToggle')) {
                    const currentUser = getCurrentUser();
                    if (!currentUser) {
                        showToast('请先登录后再回复', 'error');
                        document.getElementById('loginModal').classList.remove('hidden');
                        return;
                    }
                    
                    const replyToggle = e.target.closest('.replyToggle');
                    const issueCard = replyToggle.closest('.issue-card');
                    const replyForm = issueCard.querySelector('.replyForm');
                    // 切换回复表单显示/隐藏
                    replyForm.classList.toggle('hidden');
                }
            });

            // 回复提交
            document.addEventListener('submit', function(e) {
                if (e.target.classList.contains('replyForm')) {
                    e.preventDefault();
                    handleReplySubmit(e.target);
                }
            });
        }

        // 处理登录
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEY.USERS)) || [];
            const user = users.find(u => u.username === username && u.password === password);
            
            if (user) {
                // 登录成功
                if (rememberMe) {
                    localStorage.setItem(STORAGE_KEY.CURRENT_USER, JSON.stringify(user));
                } else {
                    sessionStorage.setItem(STORAGE_KEY.CURRENT_USER, JSON.stringify(user));
                }
                
                document.getElementById('loginModal').classList.add('hidden');
                showToast('登录成功！');
                checkLoginStatus();
            } else {
                // 登录失败
                showToast('用户名或密码错误', 'error');
            }
        }

        // 处理注册
        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            
            // 再次检查用户名是否存在和密码是否一致
            if (checkUsernameExists() || checkPasswordMatch()) {
                return;
            }
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEY.USERS)) || [];
            
            // 创建新用户
            const newUser = {
                username: username,
                password: password,
                displayName: username // 默认显示名称为用户名
            };
            
            users.push(newUser);
            localStorage.setItem(STORAGE_KEY.USERS, JSON.stringify(users));
            
            // 自动登录新用户
            localStorage.setItem(STORAGE_KEY.CURRENT_USER, JSON.stringify(newUser));
            
            // 保存初始显示名称
            localStorage.setItem(STORAGE_KEY.USER_NAME + username, username);
            localStorage.setItem(STORAGE_KEY.NAME_UPDATE_TIME + username, new Date().getTime().toString());
            
            document.getElementById('registerModal').classList.add('hidden');
            showToast('注册成功！已自动登录');
            checkLoginStatus();
        }

        // 检查用户名是否存在
        function checkUsernameExists() {
            const username = document.getElementById('regUsername').value.trim();
            const usernameError = document.getElementById('usernameError');
            
            if (!username) {
                usernameError.classList.add('hidden');
                return false;
            }
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEY.USERS)) || [];
            const exists = users.some(u => u.username === username);
            
            if (exists) {
                usernameError.classList.remove('hidden');
                return true;
            } else {
                usernameError.classList.add('hidden');
                return false;
            }
        }

        // 检查密码是否一致
        function checkPasswordMatch() {
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const passwordError = document.getElementById('passwordError');
            
            if (password !== confirmPassword) {
                passwordError.classList.remove('hidden');
                return true;
            } else {
                passwordError.classList.add('hidden');
                return false;
            }
        }

        // 处理退出登录
        function handleLogout() {
            localStorage.removeItem(STORAGE_KEY.CURRENT_USER);
            sessionStorage.removeItem(STORAGE_KEY.CURRENT_USER);
            
            showToast('已退出登录');
            checkLoginStatus();
        }

        // 打开名称设置模态框
        function openNameModal() {
            const currentUser = getCurrentUser();
            if (!currentUser) return;
            
            const username = currentUser.username;
            const displayName = getUserDisplayName(username) || username;
            const userNameInput = document.getElementById('userName');
            const nameModal = document.getElementById('nameModal');
            
            userNameInput.value = displayName;
            nameModal.classList.remove('hidden');
            
            // 检查是否可以修改名称
            const lastUpdateTime = localStorage.getItem(STORAGE_KEY.NAME_UPDATE_TIME + username);
            const now = new Date().getTime();
            const threeMonths = 3 * 30 * 24 * 60 * 60 * 1000; // 3个月毫秒数
            
            if (lastUpdateTime && now - lastUpdateTime < threeMonths) {
                userNameInput.disabled = true;
                const disableMessage = userNameInput.parentElement.querySelector('.text-red-500');
                if (disableMessage) disableMessage.classList.remove('hidden');
            } else {
                userNameInput.disabled = false;
                const disableMessage = userNameInput.parentElement.querySelector('.text-red-500');
                if (disableMessage) disableMessage.classList.add('hidden');
            }
        }

        // 处理名称提交
        function handleNameSubmit(e) {
            e.preventDefault();
            
            const currentUser = getCurrentUser();
            if (!currentUser) return;
            
            const username = currentUser.username;
            const userNameInput = document.getElementById('userName');
            const userName = userNameInput.value.trim();
            
            if (userName && userName.length <= 20) { // 限制名称长度
                localStorage.setItem(STORAGE_KEY.USER_NAME + username, userName);
                localStorage.setItem(STORAGE_KEY.NAME_UPDATE_TIME + username, new Date().getTime().toString());
                
                document.getElementById('displayName').textContent = userName;
                document.getElementById('nameModal').classList.add('hidden');
                
                // 更新所有相关Issue和回复的作者名称
                updateAuthorNames(username, userName);
                
                // 显示成功提示
                showToast('名称设置成功！');
            } else {
                showToast('请输入有效的名称（1-20个字符）', 'error');
            }
        }

        // 更新所有相关Issue和回复的作者名称
        function updateAuthorNames(username, newName) {
            const issues = JSON.parse(localStorage.getItem(STORAGE_KEY.ISSUES)) || [];
            
            // 更新Issue的作者名称
            issues.forEach(issue => {
                if (issue.authorUsername === username) {
                    issue.author = newName;
                }
                
                // 更新回复的作者名称
                if (issue.replies) {
                    issue.replies.forEach(reply => {
                        if (reply.authorUsername === username) {
                            reply.author = newName;
                        }
                    });
                }
            });
            
            localStorage.setItem(STORAGE_KEY.ISSUES, JSON.stringify(issues));
            loadIssues(); // 重新加载Issue列表
        }

        // 处理Issue提交
        function handleIssueSubmit(e) {
            e.preventDefault();
            
            const currentUser = getCurrentUser();
            if (!currentUser) {
                showToast('请先登录后再发布内容', 'error');
                document.getElementById('loginModal').classList.remove('hidden');
                return;
            }
            
            const titleInput = document.getElementById('issueTitle');
            const contentInput = document.getElementById('issueContent');
            
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();
            const displayName = getUserDisplayName(currentUser.username) || currentUser.username;
            const timestamp = new Date().getTime();
            const dateStr = new Date(timestamp).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // 创建新Issue
            const newIssue = {
                id: timestamp.toString(),
                title,
                content,
                author: displayName,
                authorUsername: currentUser.username,
                date: dateStr,
                timestamp,
                replies: []
            };
            
            // 保存到本地存储
            const issues = JSON.parse(localStorage.getItem(STORAGE_KEY.ISSUES)) || [];
            issues.push(newIssue);
            localStorage.setItem(STORAGE_KEY.ISSUES, JSON.stringify(issues));
            
            // 重新加载Issue列表
            loadIssues();
            
            // 清空表单
            titleInput.value = '';
            contentInput.value = '';
            
            // 显示成功提示
            showToast('Issue发布成功！');
        }

        // 处理回复提交
        function handleReplySubmit(replyForm) {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                showToast('请先登录后再回复', 'error');
                document.getElementById('loginModal').classList.remove('hidden');
                return;
            }
            
            const contentInput = replyForm.querySelector('textarea');
            const content = contentInput.value.trim();
            const issueCard = replyForm.closest('.issue-card');
            const issueId = issueCard.dataset.issueId;
            const displayName = getUserDisplayName(currentUser.username) || currentUser.username;
            
            if (!content) {
                showToast('请输入回复内容', 'error');
                return;
            }
            
            // 创建新回复
            const timestamp = new Date().getTime();
            const dateStr = new Date(timestamp).toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
            
            const newReply = {
                id: timestamp.toString(),
                author: displayName,
                authorUsername: currentUser.username,
                content,
                date: dateStr,
                timestamp
            };
            
            // 更新本地存储
            const issues = JSON.parse(localStorage.getItem(STORAGE_KEY.ISSUES)) || [];
            const issueIndex = issues.findIndex(issue => issue.id === issueId);
            
            if (issueIndex !== -1) {
                issues[issueIndex].replies.push(newReply);
                localStorage.setItem(STORAGE_KEY.ISSUES, JSON.stringify(issues));
                
                // 重新加载Issue列表
                loadIssues();
                
                // 清空回复框
                contentInput.value = '';
                
                // 显示成功提示
                showToast('回复成功！');
            } else {
                showToast('回复失败，未找到对应的Issue', 'error');
            }
        }

        // 创建Issue元素
        function createIssueElement(issue) {
            const div = document.createElement('div');
            div.className = 'issue-card';
            div.dataset.issueId = issue.id;
            
            // 计算回复数
            const replyCount = issue.replies ? issue.replies.length : 0;
            
            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h3 class="text-lg font-semibold text-dark">${escapeHtml(issue.title)}</h3>
                    <span class="text-xs text-gray-500">${issue.date}</span>
                </div>
                <div class="text-gray-700 mb-4">
                    ${escapeHtml(issue.content).replace(/\n/g, '<br>')}
                </div>
                <div class="flex justify-between items-center text-sm text-gray-500 mb-4">
                    <div class="flex items-center">
                        <i class="fa fa-user-o mr-1"></i>
                        <span>${escapeHtml(issue.author)}</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button class="replyToggle flex items-center hover:text-primary transition-colors">
                            <i class="fa fa-reply mr-1"></i>
                            <span>回复</span>
                        </button>
                        <span class="flex items-center">
                            <i class="fa fa-comment-o mr-1"></i>
                            <span>${replyCount}条回复</span>
                        </span>
                    </div>
                </div>
                <div class="replies-container mt-4 pt-4 border-t border-gray-100">
                    <form class="replyForm space-y-2 mb-4 hidden">
                        <textarea class="input-field h-20 resize-none" placeholder="输入你的回复..." required></textarea>
                        <div class="flex justify-end">
                            <button type="submit" class="btn-primary text-sm px-3 py-1">
                                提交回复
                            </button>
                        </div>
                    </form>
                    <div class="replies-list space-y-3">
                        ${issue.replies ? issue.replies.map(reply => createReplyElement(reply).outerHTML).join('') : ''}
                    </div>
                </div>
            `;
            
            return div;
        }

        // 创建回复元素
        function createReplyElement(reply) {
            const div = document.createElement('div');
            div.className = 'bg-gray-50 p-3 rounded-md';
            
            div.innerHTML = `
                <div class="flex justify-between items-center mb-1">
                    <span class="text-sm font-medium">${escapeHtml(reply.author)}</span>
                    <span class="text-xs text-gray-500">${reply.date}</span>
                </div>
                <p class="text-sm text-gray-700">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</p>
            `;
            
            return div;
        }

        // 显示提示框
        function showToast(message, type = 'success') {
            // 移除已存在的toast
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            
            // 创建新toast
            const toast = document.createElement('div');
            toast.className = `toast fixed bottom-4 right-4 px-4 py-2 rounded-md shadow-lg flex items-center space-x-2 z-50 transition-all duration-300 transform translate-y-0 opacity-100`;
            
            if (type === 'success') {
                toast.classList.add('bg-green-500', 'text-white');
                toast.innerHTML = `<i class="fa fa-check-circle"></i><span>${message}</span>`;
            } else {
                toast.classList.add('bg-red-500', 'text-white');
                toast.innerHTML = `<i class="fa fa-exclamation-circle"></i><span>${message}</span>`;
            }
            
            document.body.appendChild(toast);
            
            // 3秒后隐藏
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // HTML转义，防止XSS攻击
        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
